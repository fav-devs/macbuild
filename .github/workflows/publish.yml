name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      action:
        description: Stage for approval or publish directly
        type: choice
        default: stage
        options:
          - stage
          - publish

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@latest
      - run: npm ci --prefix ui --no-audit --no-fund
      - run: npm test
      - run: npm pack --dry-run
      # Configure fav-devs/macbuild and publish.yml as a trusted publisher on npm first.
      # Alternatively, save a granular npm token as the repository secret NPM_TOKEN.
      - name: Stage package for npm approval
        if: inputs.action == 'stage'
        run: npm stage publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish package directly
        if: inputs.action == 'publish'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
